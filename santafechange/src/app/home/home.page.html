<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      {{ homePageTitle }}
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">
        {{ homePageTitle }}
      </ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <strong>
      {{ homePageTitle }}
    </strong>
   </div>
</ion-content>
